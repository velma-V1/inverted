# Preregistered one-campaign decisive configuration.
benchmark:
  families: [state, policy, reconciliation]
  complexities: [1, 2, 3, 4]
  qualities: [0.20, 0.40, 0.60, 0.80, 0.95]
  seeds: [101, 211, 307, 401, 503]
  epochs: 3
  arms: [A_DIRECT, B_DIRECT_CHECKED, C_SYSTEM, D_INVERTED, E_RANDOM_AUDITOR, F_ORACLE_AUDITOR]
  max_candidates: 3
  max_tokens_per_trial: 4096
  decisive: true
  minimum_primary_trials: 180
  bootstrap_samples: 10000
  bootstrap_seed: 20260830
preflight:
  # 6 representative tasks x executor+auditor = 12 calls per real model.
  # Covers state/policy/reconciliation at complexity 1 and 4.
  cells_per_model: 12
  # Zero-censorship gate: 0/12 passes; >=1/12 aborts before the decisive campaign.
  max_generation_censored: 0
models:
  - provider: ollama
    model: ${INVERTED_MODEL_1}
    base_url: http://127.0.0.1:11434
    temperature: 0.0
    max_tokens: 1024
    timeout_s: 600
    max_retries: 2
    retry_backoff_s: 5
    think: false
    format_json: true
    context_limit: 8192
  - provider: ollama
    model: ${INVERTED_MODEL_2}
    base_url: http://127.0.0.1:11434
    temperature: 0.0
    max_tokens: 1024
    timeout_s: 600
    max_retries: 2
    retry_backoff_s: 5
    think: false
    format_json: true
    context_limit: 8192
  - provider: ollama
    model: ${INVERTED_MODEL_3}
    base_url: http://127.0.0.1:11434
    temperature: 0.0
    max_tokens: 1024
    timeout_s: 600
    max_retries: 2
    retry_backoff_s: 5
    think: false
    format_json: true
    context_limit: 8192
report:
  capture_content: true
  include_raw_rows: true
output_dir: runs
