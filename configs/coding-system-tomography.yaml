coding_tomography:
  # Every session is a real full coding-agent run. The campaign refuses to start
  # if the deterministic plan exceeds this cap.
  max_sessions: 160

  # Two clean native observations distinguish stable behavior from one-off
  # stochastic trajectories before causal interventions are interpreted.
  native_repeats: 2
  intervention_repeats: 1
  include_common_interventions: true

  # Per agent-task session watchdog. A timeout is preserved as evidence.
  timeout_s: 1800

  # Native arms deliberately add no permission bypass or extra behavioral
  # instruction. Exact local user/project policy therefore remains part of
  # provenance. Add explicit extra_args only for preregistered intervention arms.
  subjects:
    - name: claude_code
      executable: claude
      extra_args: []

    - name: codex
      executable: codex
      extra_args: []
