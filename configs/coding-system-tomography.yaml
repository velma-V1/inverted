coding_tomography:
  # Hard physical-agent-call ceiling. Static work schedules 154 sessions and
  # reserves up to 6 adaptive exact-failure replays. Unused replay slots do not
  # launch filler calls.
  max_sessions: 160

  # Two untouched native observations per subject/task establish stability.
  native_repeats: 2
  intervention_repeats: 1
  include_common_interventions: true

  # Common factors are sampled on six representative families instead of every
  # task, preserving calls for mechanism-specific probes.
  common_intervention_task_ids:
    - PU01-false-green
    - PUC01-false-green-generated-package
    - PUC03-circular-evidence-split-brain
    - PUC05-active-path-generated-generalization
    - PUC06-parallel-opportunity
    - PUC08-transient-retry

  # Logging-only Claude lifecycle hooks on the two cases where richer lifecycle
  # evidence is most valuable. These sessions are excluded from native
  # performance comparisons.
  observability_repeats: 1
  observability_subjects: [claude_code]
  observability_task_ids:
    - PUC06-parallel-opportunity
    - PUC12-context-pressure-authority

  # Matched phase-two tests: exact same post-phase-one repository state, then
  # fresh session versus resumed session.
  resume_task_ids:
    - PUC10-unfinished-work
    - PUC12-context-pressure-authority

  # Native runs on this task are the no-service baseline. One treatment per
  # subject exposes a deterministic local stdio MCP reference service.
  mcp_task_ids:
    - PUC13-mcp-reference-escalation

  # After scheduled work, retry up to six failed untouched native trials from
  # their exact original initial state using only prior observable failure
  # evidence. Hidden-oracle contents are never put into replay prompts.
  replay_reserve_slots: 6

  timeout_s: 1800

  # 20 information-dense executable tasks. Three older simple fixtures were
  # removed from the default allocation because their mechanisms are covered
  # more strongly by compound/pathology cases.
  task_ids:
    - PU01-false-green
    - PU09-stale-test
    - PU27-negative-space
    - PU29-underengineering
    - PU31-generalization
    - PU37-misattribution
    - PU39-evidence-composition
    - PUC01-false-green-generated-package
    - PUC02-shared-invariant-migration
    - PUC03-circular-evidence-split-brain
    - PUC04-correctly-unsolvable
    - PUC05-active-path-generated-generalization
    - PUC06-parallel-opportunity
    - PUC07-parallel-hazard
    - PUC08-transient-retry
    - PUC09-false-tool-success
    - PUC10-unfinished-work
    - PUC11-least-privilege-tool-choice
    - PUC12-context-pressure-authority
    - PUC13-mcp-reference-escalation

  subjects:
    - name: claude_code
      executable: claude
      extra_args: []

    - name: codex
      executable: codex
      extra_args: []
