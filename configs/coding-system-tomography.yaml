coding_tomography:
  # Every session is a real full coding-agent run. The campaign refuses to start
  # if the deterministic plan exceeds this cap.
  max_sessions: 162

  # Two clean native observations distinguish stable behavior from one-off
  # stochastic trajectories before causal interventions are interpreted.
  native_repeats: 2
  intervention_repeats: 2
  include_common_interventions: true

  # Two extra Claude-only sessions add logging-only lifecycle hooks for rich
  # tool/subagent/permission/context telemetry. They are excluded from native
  # performance comparisons.
  observability_repeats: 1
  observability_subjects: [claude_code]
  observability_task_ids:
    - PUC01-false-green-generated-package
    - PUC05-active-path-generated-generalization

  # Per agent-task session watchdog. A timeout is preserved as evidence.
  timeout_s: 1800

  task_ids:
    - PU01-false-green
    - PU09-stale-test
    - PU29-underengineering
    - PU31-generalization
    - PU37-misattribution
    - PUC01-false-green-generated-package
    - PUC02-shared-invariant-migration
    - PUC03-circular-evidence-split-brain
    - PUC04-correctly-unsolvable
    - PUC05-active-path-generated-generalization


  # Native arms deliberately add no permission bypass or extra behavioral
  # instruction. Exact local user/project policy therefore remains part of
  # provenance. Add explicit extra_args only for preregistered intervention arms.
  subjects:
    - name: claude_code
      executable: claude
      extra_args: []

    - name: codex
      executable: codex
      extra_args: []
