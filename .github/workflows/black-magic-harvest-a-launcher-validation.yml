name: black-magic-harvest-a-launcher-validation

on:
  push:
  pull_request:

jobs:
  windows-launcher-checkpoint:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Parse Harvest A launcher, monitor, and publisher scripts
        shell: powershell
        run: |
          $files = @(
            'run-harvest-a.ps1',
            'scripts/test-black-magic-harvest-a-publisher.ps1',
            'scripts/test-black-magic-harvest-a-monitor.ps1',
            'scripts/watch-black-magic-harvest-a.ps1'
          )
          if (Test-Path 'scripts/publish-black-magic-harvest-a.ps1') {
            $files += 'scripts/publish-black-magic-harvest-a.ps1'
          }
          foreach ($file in $files) {
            Write-Host "PARSING: $file"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($err in $errors) {
                Write-Host ("PARSE ERROR file={0} line={1} col={2} message={3}" -f $file, $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message)
              }
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Prove isolated remote checkpoint publisher
        shell: powershell
        run: .\scripts\test-black-magic-harvest-a-publisher.ps1
      - name: Prove live progress monitor fields and completion
        shell: powershell
        run: .\scripts\test-black-magic-harvest-a-monitor.ps1
