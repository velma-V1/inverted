name: validation-evidence

on:
  push:
    branches:
      - main
      - "build/**"
  workflow_dispatch:

jobs:
  validate-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Create evidence directory
        run: python -c "from pathlib import Path; Path('validation-output').mkdir(parents=True, exist_ok=True)"
      - name: Full pytest suite
        shell: bash
        run: set -o pipefail; python -m pytest -q 2>&1 | tee validation-output/pytest.txt
      - name: Known-answer and full-matrix stress validation
        run: python scripts/run_validation.py --output-dir validation-output
      - name: Print validation manifest
        run: python -c "from pathlib import Path; print(Path('validation-output/validation-manifest.json').read_text(encoding='utf-8'))"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverted-validation-evidence
          path: validation-output
          if-no-files-found: error
          retention-days: 30
