name: test1b-v3-validation

on:
  push:
    branches:
      - build/test1b-v3-qwen-atlas
  pull_request:
    paths:
      - "src/inverted/capability_ratchet/**"
      - "src/inverted/universal_tuning/core.py"
      - "src/inverted/universal_tuning/qwen_ollama.py"
      - "tests/test_test1b_v3_*.py"
      - "tests/test_universal_tuning_*.py"
      - "tests/test_capability_ratchet_snapshot.py"
      - "tests/test_capability_ratchet_replay.py"
      - "tests/test_capability_ratchet_replay_store.py"
      - "tests/test_capability_ratchet_qwen_replay.py"
      - ".github/workflows/test1b-v3-validation.yml"

jobs:
  orchestration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Test Test1B-v3, universal tuning, and TEST_REPLAY regressions
        run: >-
          python -m pytest -q
          -k "not powershell_launcher_uses_v2_default_dry_run"
          tests/test_test1b_v3_*.py
          tests/test_universal_tuning_*.py
          tests/test_capability_ratchet_snapshot.py
          tests/test_capability_ratchet_replay.py
          tests/test_capability_ratchet_replay_store.py
          tests/test_capability_ratchet_qwen_replay.py
