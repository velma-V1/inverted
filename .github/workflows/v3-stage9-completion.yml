name: v3-stage9-completion

on:
  push:
    branches:
      - build/qwen-thinking-tuning
    paths:
      - .gitignore
      - .github/workflows/v3-stage9-completion.yml
      - docs/superpowers/specs/2026-09-09-v3-stage9-fine-tuning-qualification-controlled-lane-design.md
      - docs/superpowers/plans/2026-09-09-v3-stage9-fine-tuning-qualification-controlled-lane.md
      - src/inverted/capability_ratchet/**
      - scripts/audit-v3-replay-foundation.py
      - scripts/audit-v3-replay-foundation-legacy.py
      - tests/test_capability_ratchet_*.py
      - tests/test_universal_tuning_*.py
      - tests/test_qwen_thinking_tuning.py
      - live-evidence/qwen-thinking-tuning-v2-real-20260907/**
      - src/inverted/evidence_privacy.py
      - evidence/PRIVACY-TRACKED-SCAN.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage9-platform-matrix:
    name: stage9-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Run dedicated Stage-9 fine-tuning suite
        run: python -m pytest tests/test_capability_ratchet_fine_tuning_*.py -q
      - name: Run full capability-ratchet suite
        run: python -m pytest tests/test_capability_ratchet_*.py -q

  stage9-zero-call-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"

      - name: Verify tracked evidence privacy
        run: >-
          python -m inverted.evidence_privacy check
          --root evidence
          --scan-out /tmp/stage9-privacy.json

      - name: Run dedicated Stage-9 fine-tuning suite
        run: python -m pytest tests/test_capability_ratchet_fine_tuning_*.py -q

      - name: Run full capability-ratchet suite
        run: python -m pytest tests/test_capability_ratchet_*.py -q

      - name: Run explicit V2 regression suite
        run: >-
          python -m pytest
          tests/test_universal_tuning_end_to_end.py
          tests/test_universal_tuning_qwen_cli.py
          tests/test_universal_tuning_runner.py
          tests/test_universal_tuning_scheduler.py
          tests/test_universal_tuning_scoring.py
          tests/test_universal_tuning_statistics.py
          tests/test_universal_tuning_tasks.py
          tests/test_universal_tuning_v1_audit.py
          tests/test_qwen_thinking_tuning.py
          -q -k
          "not test_powershell_launcher_dry_run_executes_repo_local_module and not test_powershell_launcher_uses_v2_default_dry_run"

      - name: Run full repository regression on Linux
        run: >-
          python -m pytest -q -k
          "not test_powershell_launcher_dry_run_executes_repo_local_module and not test_powershell_launcher_uses_v2_default_dry_run"

      - name: Seed canonical historical replay corpus with zero inference
        shell: bash
        run: |
          rm -rf /tmp/v3-stage9-completion
          mkdir -p \
            /tmp/v3-stage9-completion/replay \
            /tmp/v3-stage9-completion/causal \
            /tmp/v3-stage9-completion/surface \
            /tmp/v3-stage9-completion/mutation \
            /tmp/v3-stage9-completion/tomography \
            /tmp/v3-stage9-completion/compilation \
            /tmp/v3-stage9-completion/fine-tuning
          python -m inverted.capability_ratchet.cli seed-v2 \
            --source live-evidence/qwen-thinking-tuning-v2-real-20260907 \
            --replay-root /tmp/v3-stage9-completion/replay \
            > /tmp/v3-stage9-completion/seed.json

      - name: Run permanent replay Stage-5/6/7/8/9 omission audit
        shell: bash
        run: |
          python scripts/audit-v3-replay-foundation.py \
            --source live-evidence/qwen-thinking-tuning-v2-real-20260907 \
            --replay-root /tmp/v3-stage9-completion/replay \
            > /tmp/v3-stage9-completion/audit.json

      - name: Scan historical Stage-9 eligibility with zero model calls
        shell: bash
        run: |
          python -m inverted.capability_ratchet.cli scan-fine-tuning-eligibility \
            --replay-root /tmp/v3-stage9-completion/replay \
            --causal-root /tmp/v3-stage9-completion/causal \
            --surface-root /tmp/v3-stage9-completion/surface \
            --mutation-root /tmp/v3-stage9-completion/mutation \
            --tomography-root /tmp/v3-stage9-completion/tomography \
            --compilation-root /tmp/v3-stage9-completion/compilation \
            --fine-tuning-root /tmp/v3-stage9-completion/fine-tuning \
            > /tmp/v3-stage9-completion/historical-stage9-scan.json

      - name: Plan historical Stage-9 work with zero model calls
        shell: bash
        run: |
          python -m inverted.capability_ratchet.cli plan-fine-tuning \
            --replay-root /tmp/v3-stage9-completion/replay \
            --causal-root /tmp/v3-stage9-completion/causal \
            --surface-root /tmp/v3-stage9-completion/surface \
            --mutation-root /tmp/v3-stage9-completion/mutation \
            --tomography-root /tmp/v3-stage9-completion/tomography \
            --compilation-root /tmp/v3-stage9-completion/compilation \
            --fine-tuning-root /tmp/v3-stage9-completion/fine-tuning \
            --auto-eligible \
            > /tmp/v3-stage9-completion/historical-stage9-plan.json

      - name: Summarize deterministic Stage-9 dataset state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from inverted.capability_ratchet import FineTuningDisposition, FineTuningEvidenceStore

          root = Path('/tmp/v3-stage9-completion')
          store = FineTuningEvidenceStore(root / 'fine-tuning')
          validation = store.validate()
          assert validation.ok
          datasets = store.datasets()
          qualifications = store.qualifications()
          plans = store.plans()
          summary = {
              'MODEL_CALLS': 0,
              'fine_tuning_store_valid': True,
              'dataset_count': len(datasets),
              'dataset_hashes': sorted(item.dataset_hash for item in datasets),
              'qualified_lanes': sum(
                  item.disposition is FineTuningDisposition.QUALIFY_CONTROLLED_LANE
                  for item in qualifications
              ),
              'authorization_statuses': sorted({item.authorization_status for item in plans}),
              'training_authorized_count': sum(bool(item.training_authorized) for item in plans),
          }
          (root / 'dataset-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY

      - name: Enforce Stage-9 completion invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/v3-stage9-completion')
          seed = json.loads((root / 'seed.json').read_text(encoding='utf-8'))
          audit = json.loads((root / 'audit.json').read_text(encoding='utf-8'))
          scan = json.loads((root / 'historical-stage9-scan.json').read_text(encoding='utf-8'))
          plan = json.loads((root / 'historical-stage9-plan.json').read_text(encoding='utf-8'))
          datasets = json.loads((root / 'dataset-summary.json').read_text(encoding='utf-8'))
          privacy = json.loads(Path('/tmp/stage9-privacy.json').read_text(encoding='utf-8'))

          assert seed['MODEL_CALLS'] == 0
          assert audit['MODEL_CALLS'] == 0
          assert scan['MODEL_CALLS'] == 0
          assert plan['MODEL_CALLS'] == 0
          assert datasets['MODEL_CALLS'] == 0
          assert audit['forgotten_count'] == 0, audit.get('forgotten_items')
          assert audit['orphan_asset_count'] == 0
          assert audit['stage9_cli_surface_contract'] is True
          assert audit['stage9_zero_call_contract'] is True
          assert audit['stage9_no_independent_trainer_contract'] is True
          assert audit['stage9_model_internal_owner_contract'] is True
          assert audit['stage9_cheaper_owner_veto_contract'] is True
          assert audit['stage9_recurrence_contract'] is True
          assert audit['stage9_stage8_generalization_gate'] is True
          assert audit['stage9_protected_partition_veto_contract'] is True
          assert audit['stage9_train_eval_disjoint_contract'] is True
          assert audit['stage9_leakage_veto_contract'] is True
          assert audit['stage9_observable_target_contract'] is True
          assert audit['stage9_regression_negative_transfer_contract'] is True
          assert audit['stage9_qualification_not_training_contract'] is True
          assert audit['stage9_not_authorized_contract'] is True
          assert audit['stage9_stage11_confirmation_contract'] is True
          assert audit['stage9_certified_event_count'] == 0
          assert privacy['privacy_ok'] is True
          assert privacy['total_matches'] == 0

          assert scan['status'] == 'FINE_TUNING_ELIGIBILITY_SCAN'
          assert isinstance(scan['rows'], list)
          assert plan['status'] in {
              'NO_ELIGIBLE_FINE_TUNING_CANDIDATES',
              'FINE_TUNING_PLAN_READY',
              'ALL_ELIGIBLE_FINE_TUNING_CANDIDATES_QUALIFIED',
              'CHEAPER_OWNER_UNRESOLVED',
              'REQUIRES_MORE_FINE_TUNING_EVIDENCE',
          }
          assert isinstance(plan['eligible_candidate_ids'], list)
          assert datasets['fine_tuning_store_valid'] is True
          assert datasets['training_authorized_count'] == 0
          assert all(value == 'NOT_AUTHORIZED' for value in datasets['authorization_statuses'])

          summary = {
              'STAGE9_COMPLETION': 'PASS',
              'MODEL_CALLS': 0,
              'historical_stage9_status': plan['status'],
              'eligible_candidates': len(plan['eligible_candidate_ids']),
              'qualified_lanes': datasets['qualified_lanes'],
              'dataset_count': datasets['dataset_count'],
              'dataset_hashes': datasets['dataset_hashes'],
              'stage9_cli_surface_contract': audit['stage9_cli_surface_contract'],
              'stage9_zero_call_contract': audit['stage9_zero_call_contract'],
              'stage9_no_independent_trainer_contract': audit['stage9_no_independent_trainer_contract'],
              'stage9_model_internal_owner_contract': audit['stage9_model_internal_owner_contract'],
              'stage9_cheaper_owner_veto_contract': audit['stage9_cheaper_owner_veto_contract'],
              'stage9_recurrence_contract': audit['stage9_recurrence_contract'],
              'stage9_stage8_generalization_gate': audit['stage9_stage8_generalization_gate'],
              'stage9_protected_partition_veto_contract': audit['stage9_protected_partition_veto_contract'],
              'stage9_train_eval_disjoint_contract': audit['stage9_train_eval_disjoint_contract'],
              'stage9_leakage_veto_contract': audit['stage9_leakage_veto_contract'],
              'stage9_observable_target_contract': audit['stage9_observable_target_contract'],
              'stage9_regression_negative_transfer_contract': audit['stage9_regression_negative_transfer_contract'],
              'stage9_qualification_not_training_contract': audit['stage9_qualification_not_training_contract'],
              'stage9_not_authorized_contract': audit['stage9_not_authorized_contract'],
              'stage9_stage11_confirmation_contract': audit['stage9_stage11_confirmation_contract'],
              'stage9_certified_event_count': audit['stage9_certified_event_count'],
              'forgotten_count': audit['forgotten_count'],
              'orphan_assets': audit['orphan_asset_count'],
              'privacy_matches': privacy['total_matches'],
          }
          (root / 'STAGE9-COMPLETION.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY

      - name: Verify tracked tree remains clean
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Stage-9 zero-call completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-stage9-completion-evidence
          path: |
            /tmp/v3-stage9-completion/seed.json
            /tmp/v3-stage9-completion/audit.json
            /tmp/v3-stage9-completion/historical-stage9-scan.json
            /tmp/v3-stage9-completion/historical-stage9-plan.json
            /tmp/v3-stage9-completion/dataset-summary.json
            /tmp/v3-stage9-completion/STAGE9-COMPLETION.json
            /tmp/stage9-privacy.json
          if-no-files-found: error
