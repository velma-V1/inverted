name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir ci-runs --run-id ci-smoke > ci-report.txt
      - run: python -c "from pathlib import Path; text=Path('ci-report.txt').read_text(encoding='utf-8'); assert 'VERDICT: NON-DECISIVE' in text"
