name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir /tmp/inverted-runs --run-id ci-smoke > /tmp/inverted-report.txt
      - run: grep -q 'VERDICT: NON-DECISIVE' /tmp/inverted-report.txt
