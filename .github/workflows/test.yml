name: test

on:
  push:
  pull_request:

jobs:
  ubuntu-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir ci-runs --run-id ci-smoke > ci-report.txt
      - run: >-
          python -c "from pathlib import Path; text=Path('ci-report.txt').read_text(encoding='utf-8'); assert 'VERDICT: NON-DECISIVE' in text"

  ubuntu-py312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir ci-runs --run-id ci-smoke > ci-report.txt
      - run: >-
          python -c "from pathlib import Path; text=Path('ci-report.txt').read_text(encoding='utf-8'); assert 'VERDICT: NON-DECISIVE' in text"

  ubuntu-py314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir ci-runs --run-id ci-smoke > ci-report.txt
      - run: >-
          python -c "from pathlib import Path; text=Path('ci-report.txt').read_text(encoding='utf-8'); assert 'VERDICT: NON-DECISIVE' in text"

  windows-py314:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Parse Inverted PowerShell scripts
        shell: powershell
        run: |
          $scripts = @(
            'scripts/publish-inverted-checkpoints.ps1',
            'scripts/test-checkpoint-publisher.ps1',
            'scripts/preserve-harvest-d-d4-r1-evidence.ps1',
            'scripts/test-harvest-d-d4-r1-evidence-publisher.ps1',
            'scripts/collect-harvest-d-post-r1-data-dump.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse failure: $script"
              $errors | Format-List | Out-String | Write-Host
              exit 1
            }
          }
      - name: End-to-end checkpoint publisher integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-checkpoint-publisher.ps1
      - name: D4/R1 evidence publisher integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-harvest-d-d4-r1-evidence-publisher.ps1
      - run: python -m inverted.cli --config configs/smoke.yaml --output-dir ci-runs --run-id ci-smoke > ci-report.txt
      - run: >-
          python -c "from pathlib import Path; text=Path('ci-report.txt').read_text(encoding='utf-8'); assert 'VERDICT: NON-DECISIVE' in text"
