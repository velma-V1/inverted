name: test3-s1-validation

on:
  push:
    branches:
      - design/test3-adaptive-evidence-discovery
      - build/test3-s1-fixed-stack-order
  pull_request:
  workflow_dispatch:

jobs:
  test3-s1-mock-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Full pytest suite
        run: python -m pytest -q
      - name: Run Section 1 R1 mock smoke
        run: >-
          python -m inverted.test3_s1_cli mock-smoke
          --output-dir test3-s1-ci/mock-validation
          --run-id test3-s1-r1-mock
      - name: Verify mock-only S1-R1 exact exposure contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p = Path("test3-s1-ci/mock-validation")
          verdict = json.loads((p / "verdict.json").read_text(encoding="utf-8"))
          master = json.loads((p / "00-MASTER-INDEX.json").read_text(encoding="utf-8"))
          prereg = json.loads((p / "preregistration.json").read_text(encoding="utf-8"))
          exposure = json.loads((p / "intervention_exposure.json").read_text(encoding="utf-8"))
          failures = json.loads((p / "protocol_failures.json").read_text(encoding="utf-8"))
          calls = [
              json.loads(line)
              for line in (p / "model_calls.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          assert verdict["verdict"] == "MOCK_VALIDATION_ONLY", verdict
          assert verdict["tier_a_architecture_claim"] is False, verdict
          assert verdict["real_model_inference"] is False, verdict
          assert verdict["protocol_valid_for_primary_claim"] is True, verdict
          assert verdict["protocol_revision"] == "S1-R1", verdict
          assert verdict["holdout"] == "A-R1", verdict
          assert verdict["physical_model_calls"] == 80, verdict
          assert verdict["matched_task_count"] == 10, verdict

          assert master["protocol_revision"] == "S1-R1", master
          assert master["holdout"] == "A-R1", master
          assert master["protocol_valid_for_primary_claim"] is True, master
          assert master["physical_model_calls"] == 80, master
          assert master["matched_task_count"] == 10, master

          assert prereg["protocol_revision"] == "S1-R1", prereg
          assert prereg["holdout"] == "A-R1", prereg
          assert prereg["exact_budget"] == 80, prereg
          assert prereg["arm_count"] == 4, prereg
          assert prereg["physical_call_cap_per_arm"] == 20, prereg
          assert prereg["matched_tasks"] == 10, prereg
          assert prereg["calls_per_arm_task"] == 2, prereg

          assert len(calls) == 80, len(calls)
          assert all((row.get("telemetry") or {}).get("provider") == "mock" for row in calls)
          assert all(row.get("cache_hit") is False for row in calls)
          assert all(bool(row.get("active_intervention")) != bool(row.get("shadow_only")) for row in calls)
          assert sum(bool(row.get("active_intervention")) for row in calls) >= 40

          assert failures == [], failures
          assert exposure["all_seed_failures_verified"] is True, exposure
          assert exposure["all_arm_tasks_have_active_intervention"] is True, exposure
          assert exposure["all_calls_partitioned_active_or_shadow"] is True, exposure
          assert exposure["distinct_fixed_first_active_components"] >= 2, exposure
          assert exposure["cache_hits"] == 0, exposure

          with (p / "SHA256SUMS.csv").open(encoding="utf-8", newline="") as handle:
              hashes = list(csv.DictReader(handle))
          assert hashes and all((p / row["path"]).is_file() for row in hashes)
          PY
      - name: Upload Section 1 R1 mock validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: test3-s1-validation-evidence
          path: test3-s1-ci/mock-validation
          if-no-files-found: error
