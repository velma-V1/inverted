name: Temporary refine leak statistics

on:
  push:
    branches:
      - build/assistant-value-trust-tests
    paths:
      - .github/workflows/_temporary-refine-leak-statistics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/assistant-value-trust-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refine cross-case statistical proxy signals
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/inverted/assistant_value/ground_truth_isolation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('        proxy_feature = correct\n', '')
          text = text.replace('        proxy_feature = str(bit)\n', '')
          old = '''    elif regime == "cross_trial_contamination":
              _set_nested(observed_payload, ("memory", "previous_case_selected_action"), correct)
              planted = True
          '''
          new = '''    elif regime == "cross_trial_contamination":
              _set_nested(observed_payload, ("memory", "previous_case_selected_action"), correct)
              proxy_feature = correct.rsplit("-", 1)[-1]
              planted = True
          '''
          if old not in text:
              raise SystemExit('cross-trial block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Run focused tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_assistant_value_ground_truth_isolation.py tests/test_assistant_value_runner.py tests/test_assistant_value_budget.py
      - name: Commit statistical refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inverted/assistant_value/ground_truth_isolation.py
          git commit -m "refactor: isolate aggregate leak proxy signals"
          git push origin HEAD:build/assistant-value-trust-tests
