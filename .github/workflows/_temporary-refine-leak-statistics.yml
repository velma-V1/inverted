name: Temporary refine leak statistics

on:
  push:
    branches:
      - build/assistant-value-trust-tests
    paths:
      - .github/workflows/_temporary-refine-leak-statistics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/assistant-value-trust-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refine cross-case statistical proxy signals
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/inverted/assistant_value/ground_truth_isolation.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          out = []
          regime = None
          allowed = {'provenance_proxy', 'cross_trial_contamination', 'control_plane_proxy'}
          for line in lines:
              match = re.match(r'\s*(?:if|elif) regime == "([^"]+)":', line)
              if match:
                  regime = match.group(1)
              if line.strip().startswith('proxy_feature ='):
                  if regime not in allowed:
                      continue
                  if regime == 'cross_trial_contamination':
                      indent = line[:len(line) - len(line.lstrip())]
                      line = indent + 'proxy_feature = correct.rsplit("-", 1)[-1]\n'
              out.append(line)
          patched = ''.join(out)
          required = {
              'provenance_proxy': 'proxy_feature = "A" if correct == action_a else "B"',
              'cross_trial_contamination': 'proxy_feature = correct.rsplit("-", 1)[-1]',
              'control_plane_proxy': 'proxy_feature = observed_control["route_bucket"]',
          }
          for name, marker in required.items():
              if marker not in patched:
                  raise SystemExit(f'missing expected {name} proxy marker')
          path.write_text(patched, encoding='utf-8')
      - name: Run focused tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_assistant_value_ground_truth_isolation.py tests/test_assistant_value_runner.py tests/test_assistant_value_budget.py
      - name: Commit statistical refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inverted/assistant_value/ground_truth_isolation.py
          git commit -m "refactor: isolate aggregate leak proxy signals"
          git push origin HEAD:build/assistant-value-trust-tests
