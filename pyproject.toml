[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverted-ai-benchmark"
version = "0.1.0"
description = "Falsifiable benchmark for direct AI execution versus non-AI execution plus AI auditing"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
inverted-benchmark = "inverted.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["runs", ".git", ".venv", "build", "dist", "*.egg-info"]
addopts = "-ra"
